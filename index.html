  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #080808 url("back.png") center / cover fixed no-repeat;
      color: #FFFFFF;
      font-family: "Google Sans Flex", "Pliant", ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100% - 40px, 378px);
      margin: 22px auto 58px;
      text-align: center;
    }
    .avatar-frame {
      width: 212px;
      height: 212px;
      margin: 0 auto 3px;
      padding: 6px;
      border: 6px solid #FF0030;
      border-radius: 50%;
    }
    .avatar-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 3px solid #FF0030;
      border-radius: 50%;
    }
    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.28;
      font-weight: 750;
      letter-spacing: -1.1px;
    }
    .bio {
      margin: 28px 0 35px;
      font-size: 24px;
      line-height: 1.22;
      font-weight: 400;
      letter-spacing: -.45px;
    }
    .links { display: grid; gap: 16px; }
    .link {
      min-height: 80px;
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
      align-items: center;
      border-radius: 999px;
      background: #1C1C1C;
      color: #FF0030;
      text-decoration: none;
      transition: background-color .16s ease, transform .16s ease;
    }
    .link:hover { background: #383838; transform: translateY(-2px); }
    .link:focus-visible { outline: 3px solid #ff003b; outline-offset: 3px; }
    .link i {
      grid-column: 1;
      justify-self: center;
      display: grid;
      place-items: center;
      width: 45px;
      height: 45px;
    }
    .link i svg { display: block; width: 80%; height: 80%; fill: currentColor; }
    .link span { grid-column: 2; color: #FFFFFF; font-size: 32px; line-height: 1; font-weight: 700; letter-spacing: -.8px; }
    @media (max-width: 380px) {
      main { width: calc(100% - 36px); margin-top: 18px; }
      .avatar-frame { width: 196px; height: 196px; }
      .bio { font-size: 21px; }
      .link { min-height: 72px; }
      .link span { font-size: 28px; }
      .link i { width: 43px; height: 43px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
